# Push a tag "v<version>" (matching the version in the package.json of every package in PACKAGES) to publish a release
# with one zip per package and update the VPM listing on GitHub Pages. "Run workflow" rebuilds the listing from the existing releases without releasing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGES: net.haselab.netsim net.haselab.netsim.realclient

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check versions
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          for p in $PACKAGES; do
            v=$(jq -r .version "Packages/$p/package.json")
            if [ "$v" != "$version" ]; then
              echo "tag $GITHUB_REF_NAME does not match $p/package.json version $v" >&2; exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build zips
        run: |
          for p in $PACKAGES; do
            (cd "Packages/$p" && zip -r -X "$GITHUB_WORKSPACE/$p-${{ steps.version.outputs.version }}.zip" .)
          done
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main=${PACKAGES%% *}
          gh release create "$GITHUB_REF_NAME" $(for p in $PACKAGES; do echo "$p-${{ steps.version.outputs.version }}.zip"; done) "Packages/$main/package.json" \
            --title "$GITHUB_REF_NAME" --notes-file <(awk '/^## /{n++} n==1' "Packages/$main/CHANGELOG.md")

  listing:
    needs: release
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build listing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/build_listing.py "$GITHUB_REPOSITORY" site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
