# Push a tag "v<version>" (matching Packages/net.haselab.netsim/package.json) to publish a release and update the
# VPM listing on GitHub Pages. "Run workflow" rebuilds the listing from the existing releases without releasing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE: net.haselab.netsim

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        id: version
        run: |
          version=$(jq -r .version "Packages/$PACKAGE/package.json")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build zip
        run: |
          cd "Packages/$PACKAGE"
          zip -r -X "$GITHUB_WORKSPACE/$PACKAGE-${{ steps.version.outputs.version }}.zip" .
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$PACKAGE-${{ steps.version.outputs.version }}.zip" "Packages/$PACKAGE/package.json" \
            --title "$GITHUB_REF_NAME" --notes-file <(awk '/^## /{n++} n==1' "Packages/$PACKAGE/CHANGELOG.md")

  listing:
    needs: release
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build listing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/build_listing.py "$GITHUB_REPOSITORY" site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
